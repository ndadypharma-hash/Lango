# Compilation en ligne de l'application Android de test (Codemagic).
# Adresse du serveur : lib/config.dart (modifiable avec la variable API_URL).
workflows:
  android-test:
    name: Lango Android — version de test
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Préparer le projet Android
        script: cd app && bash tool/prepare_android.sh
      - name: Installer les dépendances
        script: cd app && flutter pub get
      - name: Analyser le code
        script: cd app && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        script: cd app && flutter test
      - name: Construire l'APK
        script: |
          cd app
          # API_URL facultative : sans elle, l'application utilise le serveur de test inscrit dans lib/config.dart
          if [ -n "${API_URL:-}" ]; then
            flutter build apk --release --dart-define=API_URL=$API_URL
          else
            flutter build apk --release
          fi
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk
