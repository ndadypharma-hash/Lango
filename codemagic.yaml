# Compilation en ligne de l'application Android de test (Codemagic).
# Dans l'interface Codemagic, définir la variable API_URL (adresse du serveur Lango).
workflows:
  android-test:
    name: Lango Android — version de test
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        - lango   # groupe de variables créé dans Codemagic, contenant API_URL
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Préparer le projet Android
        script: cd app && bash tool/prepare_android.sh
      - name: Installer les dépendances
        script: cd app && flutter pub get
      - name: Analyser le code
        script: cd app && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        script: cd app && flutter test
      - name: Construire l'APK
        script: cd app && flutter build apk --release --dart-define=API_URL=$API_URL
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk
